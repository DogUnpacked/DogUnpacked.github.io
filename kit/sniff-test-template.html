<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>The Sniff Test</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><style>td,p,li,a,span{font-family:Arial,Helvetica,sans-serif!important;}.sn-serif{font-family:Georgia,'Times New Roman',serif!important;}</style><![endif]-->
<style>@font-face{font-family:Fraunces;font-style:normal;font-weight:500 800;src:url('https://dogunpacked.com/fonts/fraunces-latin.woff2') format('woff2');}@font-face{font-family:Nunito;font-style:normal;font-weight:400 800;src:url('https://dogunpacked.com/fonts/nunito-latin.woff2') format('woff2');}body{margin:0!important;padding:0!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}table,td{mso-table-lspace:0pt;mso-table-rspace:0pt;}img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}.sn-link:hover{color:#8C6239!important;}@media screen and (max-width:520px){.sn-outer{padding:12px 0 24px!important;}.sn-pad{padding-left:22px!important;padding-right:22px!important;}.sn-body{padding-top:28px!important;padding-bottom:28px!important;}.sn-text,.sn-text li{font-size:17px!important;line-height:1.6!important;}.sn-h1{font-size:28px!important;}.sn-word{font-size:28px!important;}.sn-btn a{display:block!important;}.sn-radius-top{border-radius:0!important;}.sn-radius-bottom{border-radius:0!important;}}@media (prefers-color-scheme:dark){.sn-bg{background:#0E1626!important;}.sn-card{background:#152238!important;border-color:#3A4A6A!important;}.sn-card,.sn-text,.sn-text li,.sn-h1,.sn-h2,.sn-sign{color:#F5EDDC!important;}.sn-link{color:#D89B3D!important;}.sn-muted,.sn-muted a{color:#B9C1D3!important;}.sn-reply{background:#1F2F52!important;}.sn-btn td{background:#D89B3D!important;}.sn-btn a{color:#1B2A4A!important;background:#D89B3D!important;}}[data-ogsc] .sn-text,[data-ogsc] .sn-text li,[data-ogsc] .sn-h1,[data-ogsc] .sn-sign{color:#F5EDDC!important;}[data-ogsc] .sn-link{color:#D89B3D!important;}</style>
</head>
<body class="sn-bg" style="margin:0;padding:0;background:#EFE6D4;">
{{ message_content }}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="sn-bg" bgcolor="#EFE6D4" style="background:#EFE6D4;width:100%;"><tr><td align="center" class="sn-muted" style="padding:0 24px 36px;font-family:Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#4F5D78;"><a href="{{ unsubscribe_url }}" style="color:#4F5D78;text-decoration:underline;">Unsubscribe</a> &nbsp;&middot;&nbsp; {{ address }}</td></tr></table>
</body>
</html>
